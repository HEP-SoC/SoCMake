name: docs_preview_workflow

# Build the docs for any PR touching docs/ or cmake/ (function docstrings feed
# the API reference) and publish them to a per-PR sub-path on gh-pages, e.g.
# https://hep-soc.github.io/SoCMake/pr-preview/pr-123/
# The preview is removed automatically when the PR is closed.
#
# Note: GITHUB_TOKEN is read-only for pull_request events coming from forks,
# so this only deploys previews for branches pushed within this repository.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'docs/**'
      - 'cmake/**'
      - '.github/workflows/pages_preview.yml'

concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview_docs_job:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DOCS_BASE_URL: /SoCMake/pr-preview/pr-${{ github.event.number }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        if: github.event.action != 'closed'
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: |
          python -m pip install -U sphinx
          python -m pip install sphinx-rtd-theme
          python -m pip install sphinx-autoapi

      - name: Build the docs
        if: github.event.action != 'closed'
        run: |
          cd docs
          python -m venv .venv
          source .venv/bin/activate
          pip install -r python_requirements.txt
          mkdir -p build
          cd build
          cmake ../
          make docusaurus_doc

      - name: Deploy / clean up PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./docs/build/docusaurus
